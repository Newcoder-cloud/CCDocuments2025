<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload Documents</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(to right, #667eea, #764ba2);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
    }
    input::file-selector-button {
      background-color: #4f46e5;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      border: none;
      cursor: pointer;
    }
    input::file-selector-button:hover {
      background-color: #4338ca;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center text-white font-sans">

  <div class="glass-card p-8 rounded-2xl w-full max-w-lg">
    <h2 class="text-3xl font-bold mb-6 text-center">Upload Documents</h2>
    <form id="uploadForm" class="space-y-4">
      
      <div>
        <label class="flex items-center font-semibold mb-1">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A5 5 0 0012 22a5 5 0 006.879-4.196M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          Full Name
        </label>
        <input type="text" name="fullname" class="w-full p-3 rounded-lg text-black" required>
      </div>

      <div>
        <label class="flex items-center font-semibold mb-1">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 5h18M3 12h18M3 19h18" />
          </svg>
          Mobile Number
        </label>
        <input type="text" name="mobile" class="w-full p-3 rounded-lg text-black" required>
      </div>

      <div>
        <label class="flex items-center font-semibold mb-1">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405M12 17h3m0 0V3m0 14l1.405-1.405M6 3h.01" />
          </svg>
          Aadhaar Card (Front + Back)
        </label>
        <input type="file" name="aadhaar" accept="image/*" multiple class="w-full text-sm" required>
        <p class="text-sm text-gray-200 mt-1">Select both front and back together</p>
      </div>

      <div>
        <label class="flex items-center font-semibold mb-1">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h10M5 6h14M5 18h14" />
          </svg>
          PAN Card
        </label>
        <input type="file" name="pan_card" accept="image/*" class="w-full text-sm" required>
      </div>

      <div>
        <label class="flex items-center font-semibold mb-1">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618V15.5a1 1 0 01-.447.832L15 19m0 0v-9m0 9H5a1 1 0 01-1-1v-6a1 1 0 011-1h10" />
          </svg>
          Selfie Photo
        </label>
        <input type="file" name="selfie" accept="image/*" capture="user" class="w-full text-sm" required>
        <p class="text-sm text-gray-200 mt-1">Opens camera on mobile</p>
      </div>

      <button type="submit" class="w-full py-3 mt-4 bg-white text-indigo-700 font-bold rounded-lg hover:bg-indigo-100 transition">
        Upload Documents
      </button>

      <p id="status" class="text-center text-sm mt-4 text-green-300 font-semibold"></p>
    </form>
  </div>

  <script>
    const DROPBOX_TOKEN = 'sl.u.AF0LX_hDSaoJW6R0GvkhvOffDRuSPJgfHSD5olWyDOOcH-GKNJKQoo0lb0I4juWkoOnF2NsjisM-MZf8K4mwzzj8GqW_U8SrlpiH9_SHbjSPyHeJNlf60dBG02BOjw6WgKeqyjqnRXh8aSKQg2tMCFY8Wow4WfJ0kmmrW7f1mRNTPpsZqv77epYVCgYfRR5Cp981mtgqK-VQXP2p8gJVKQdrCUzIcnT7zbnCiF5WNE8r6LxE6e-JIHYxZRChsk9B6N3jW6Dv25p5pf4aeZx9Hmeo6Yk7C589AlVpOH5KaRgpGLMOyB-LDlIFgGho4B8kNYyyB1RQ3ZJW89w2YGo73qtbQXuzxq2cm7nosYxyp9XC19ItJNlnmIYq_YJunq_sttAxuH5mq-hqIk0Q-L6HYdOuLyCblRuam5T8fYP6bZGIMgATPlWw74I6y4p_aLu0w7ImD8DG9vjDstihSRBz5LTVs-c75jb15RtW7tbLq3ydX2Rhl8sNe3n65DGMdY-Ky6OuWK-qnqbxusROxlUGUlyLD1Jm8yj2bRJDNmiIQIxJ4etzGTqlb8Y5WUVXdKIchZmO8biCrYz7BoOxpMP-fd-c3LYNuAU9zkQtlPoFm5r4GSUlfIPDYwiVb63aCMc-sxH6xMoVLyCIe-bYHyEqnKCktU8oyFLOnfYQjoB2_2E75WgjkVzkm3DvbBnRVmft_28kxvCq3xYNT_3scxjVrVKGfzz8FqlxZIGlOFuzoovEjH6LnhMsBHaA54dJsrMs9iqOX9beYdDQY4YqqpctLdrztQAc29lMJ35vYT0aM8q1bMO_rBgTtwt1lN-I8m0O2rfxcUuiBp78EWouNX82bR2M8b8Na0fTk44UIeiuLIUPL6KPi7o3S3DCDYFD2lmEuzioiebv0x0kRHFJJ8x0IlJ1e1-17CplN4H64FjGn2kLWLGXZeasxZvDAqKcFf1pP0awCy3GchTXaCKkWeKLZnyRbZDRQ_XMpv_Wakk7MazqbgZfd7uIrqpySApdTUajXwubHjqSYlpg2SMOKIUK4qeLV9sSumTj73_WOnttW0PlFIZeO96ERyGdEIOtEZWlaJYKzQ_T5jNVDfr3Ehp2odHdIO425D5Tp2ifvz0csEYkyF-smLM3HscdQdyfqIPqjHd14zamm4jV7E2H6xM1TV-zeo7okma31PYKWILq9b-5TXys3y-hIodpazl0MOBcYoFJc-XeDGe0kixQqrj2vFhw0bIlyt3B_SZxb7DXI8iPgCb1BH4QAXuW5nuYeH1ZbkGuwPkIYifsHb6Fm3IiGUjM'; // 👈 Replace with your Dropbox token

    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const form = e.target;
      const fullname = form.fullname.value.trim().replace(/\s+/g, '_');
      const mobile = form.mobile.value.trim();
      const folderName = `${mobile}_${fullname}`;
      const statusEl = document.getElementById('status');
      statusEl.innerText = "Uploading...";

      try {
        const aadhaarFiles = form.aadhaar.files;
        for (let i = 0; i < aadhaarFiles.length; i++) {
          const file = aadhaarFiles[i];
          const path = `/${folderName}/aadhaar_${i + 1}_${file.name}`;
          const content = await file.arrayBuffer();
          await uploadToDropbox(path, content);
        }

        const pan = form.pan_card.files[0];
        await uploadToDropbox(`/${folderName}/pan_card_${pan.name}`, await pan.arrayBuffer());

        const selfie = form.selfie.files[0];
        await uploadToDropbox(`/${folderName}/selfie_${selfie.name}`, await selfie.arrayBuffer());

        statusEl.innerText = "✅ All files uploaded successfully!";
      } catch (error) {
        console.error(error);
        statusEl.innerText = "❌ Upload failed. Try again.";
      }
    });

    async function uploadToDropbox(path, content) {
      return await fetch("https://content.dropboxapi.com/2/files/upload", {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + DROPBOX_TOKEN,
          "Dropbox-API-Arg": JSON.stringify({
            path: path,
            mode: "add",
            autorename: true,
            mute: false
          }),
          "Content-Type": "application/octet-stream"
        },
        body: content
      });
    }
  </script>

</body>
</html>
